<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pflege Trainer</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}header{background:#123b63;color:white;padding:22px;text-align:center}main{max-width:1000px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card,button{border:0;border-radius:14px;padding:18px;background:white;box-shadow:0 3px 12px #0001;cursor:pointer}.card{text-align:center;font-size:20px;font-weight:bold}.card small{display:block;font-size:13px;font-weight:normal;margin-top:8px;color:#667085}.hidden{display:none}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}button{background:#1769aa;color:white;font-weight:bold;padding:12px 16px}button.secondary{background:#64748b}button.correct{background:#16803c}button.wrong{background:#b42318}.panel{background:white;border-radius:16px;padding:20px;margin:15px 0;box-shadow:0 3px 12px #0001}.option{display:block;width:100%;text-align:left;background:#eef4fa;color:#172033;margin:8px 0}.option:hover{background:#dbeafe}.muted{color:#667085}.tag{display:inline-block;border-radius:20px;padding:5px 10px;background:#e8eef7;margin:3px;font-size:12px}.flash{font-size:24px;text-align:center;min-height:150px;display:flex;align-items:center;justify-content:center}.result{font-size:18px;font-weight:bold}
</style>
</head>
<body>
<header><h1>🩺 Pflege Trainer</h1><div>Ausbildung Pflegefachmann · Deutsch + فارسی</div></header>
<main>
<section id="home"><h2>Wähle ein Thema</h2><div id="topics" class="grid"></div></section>
<section id="menu" class="hidden"><button class="secondary" onclick="goHome()">← Startseite</button><h2 id="topicTitle"></h2><div class="toolbar"><button onclick="learn()">📖 Lernen</button><button onclick="flashcards()">📚 Lernkarten</button><button onclick="quiz(false)">🧠 Üben</button><button onclick="quiz(true)">🎯 Prüfung</button></div><div id="content"></div></section>
</main>
<script>
const topics={
 puls:{title:'💓 Puls',cards:[
 ['Was beurteilt man beim Puls?','Frequenz, Rhythmus und Qualität.','فرکانس، ریتم و کیفیت نبض.'],
 ['Wo misst man den Puls häufig?','An der A. radialis; alternativ z. B. A. carotis oder A. femoralis.','معمولاً روی شریان رادیال در مچ دست.'],
 ['Wie zählt man einen regelmäßigen Puls?','15 Sekunden zählen und mit 4 multiplizieren.','۱۵ ثانیه بشمار و در ۴ ضرب کن.'],
 ['Wie zählt man einen unregelmäßigen Puls?','Eine volle Minute zählen.','در ریتم نامنظم، یک دقیقه کامل بشمار.'],
 ['Was bedeutet Bradykardie?','Beim Erwachsenen meist unter 60 Schläge/min.','معمولاً کمتر از ۶۰ ضربه در دقیقه.'],
 ['Was kann eine Tachykardie auslösen?','Zum Beispiel Belastung, Schmerz, Angst oder Fieber.','فعالیت، درد، ترس یا تب می‌توانند باعث افزایش نبض شوند.'],
 ['Wann sollte man zusätzliche Vitalparameter erheben?','Bei auffälligem Puls oder Verschlechterung: z. B. Blutdruck, Atmung, Temperatur und ggf. SpO₂.','در نبض غیرطبیعی یا بدتر شدن وضعیت بیمار، علائم حیاتی دیگر را بررسی کن.']
],questions:[
 ['Welche drei Kriterien gehören zur Pulsbeurteilung?',['Frequenz, Rhythmus, Qualität','Nur Blutdruck und Temperatur','Nur die Hautfarbe'],0],
 ['Bei regelmäßigem Puls zählt man 15 Sekunden. Was macht man danach?',['Durch 2 teilen','Mit 4 multiplizieren','Mit 10 dividieren'],1],
 ['Bei unregelmäßigem Puls misst man wie lange?',['5 Sekunden','15 Sekunden','60 Sekunden'],2],
 ['Welche Frequenz spricht beim Erwachsenen typischerweise für Bradykardie?',['Unter 60/min','Über 100/min','Über 180/min'],0]
]},
 vital:{title:'🌡️ Vitalzeichen',cards:[
 ['Welche Vitalzeichen sind besonders wichtig?','Puls, Blutdruck, Atmung, Temperatur und je nach Situation Sauerstoffsättigung.','نبض، فشار خون، تنفس، دما و در صورت نیاز اشباع اکسیژن.'],
 ['Was ist bei auffälligen Werten wichtig?','Patientenzustand einschätzen, Messung ggf. kontrollieren, dokumentieren und weiterleiten.','وضعیت بیمار را ارزیابی، در صورت نیاز اندازه‌گیری را تکرار و گزارش کن.']
],questions:[
 ['Was ist bei einem auffälligen Vitalwert sinnvoll?',['Ignorieren','Patientenzustand prüfen und weiter handeln','Nur den Wert löschen'],1]
]},
 blutdruck:{title:'🩸 Blutdruck',cards:[
 ['Was bedeutet systolischer Blutdruck?','Druck in den großen Arterien während der Systole bzw. Auswurfphase.','فشار در شریان‌های بزرگ هنگام انقباض و خروج خون از قلب.'],
 ['Was bedeutet diastolischer Blutdruck?','Druck in den großen Arterien während der Diastole bzw. Erschlaffungsphase.','فشار هنگام استراحت قلب.'],
 ['Welche Einheit verwendet man?','mmHg = Millimeter Quecksilbersäule.','واحد میلی‌متر جیوه.'],
 ['Was ist die Windkesselfunktion?','Aorta und große Arterien speichern während der Systole elastische Energie und verhindern einen starken Druckabfall in der Diastole.','آئورت و شریان‌های بزرگ کمک می‌کنند فشار در زمان دیاستول بیش از حد پایین نیاید.'],
 ['Wie misst man indirekt?','Auskultatorisch, palpatorisch oder oszillatorisch mit Manschette.','با گوشی، لمس نبض یا دستگاه دیجیتال.'],
 ['Was ist bei der Manschette wichtig?','Manschette auf Herzhöhe; passende Größe verwenden.','کاف در ارتفاع قلب و با اندازه مناسب باشد.'],
 ['An welchem Arm sollte man nicht messen?','Nie an einem Arm mit Dialyse-Shunt; bei Schädigung möglichst den gesunden Arm nutzen.','روی دست دارای شانت دیالیز فشار نگیر؛ در آسیب یک دست، دست سالم را ترجیح بده.'],
 ['Was tun bei einem auffälligen Wert nach Aufregung oder Anstrengung?','Patient entspannen lassen und nach einigen Minuten erneut messen.','بیمار را آرام کن و پس از چند دقیقه دوباره اندازه بگیر.'],
 ['Wann Arzt informieren?','Bei unerwarteten Änderungen, stark erhöhten Werten, anhaltender milder Hypertonie, Symptomen bei niedrigem Wert oder mehreren auffälligen Vitalparametern.','در تغییرات غیرمنتظره، فشار خیلی بالا، علائم همراه فشار پایین یا چند علامت حیاتی غیرطبیعی.']
],questions:[
 ['Welche Aussage zur Blutdruckmanschette ist richtig?',['Immer unter Herzhöhe','In Herzhöhe und passende Größe','Nur am Bein verwenden'],1],
 ['Wo darf man niemals routinemäßig den Blutdruck messen?',['Am Arm mit Dialyse-Shunt','Am gesunden Arm','An beiden Armen bei Erstkontrolle'],0],
 ['Was bedeutet mmHg?',['Millimeter Herzfrequenz','Millimeter Quecksilbersäule','Messmethode Herzgeräusch'],1],
 ['Was ist bei einem auffälligen Wert nach Stress sinnvoll?',['Sofort ignorieren','Patient entspannen lassen und nachmessen','Manschette entfernen und nicht dokumentieren'],1]
]},
 herz:{title:'❤️ Herz & Kreislauf',cards:[
 ['Welche Aufgabe hat die rechte Herzhälfte?','Sie pumpt sauerstoffarmes Blut in Richtung Lunge.','نیمه راست قلب خون کم‌اکسیژن را به سمت ریه می‌فرستد.'],
 ['Welche Aufgabe hat die linke Herzhälfte?','Sie pumpt sauerstoffreiches Blut über die Aorta in den Körperkreislauf.','نیمه چپ خون اکسیژن‌دار را از طریق آئورت به بدن می‌فرستد.'],
 ['Welche vier Herzklappen gibt es?','Trikuspidalklappe, Pulmonalklappe, Mitralklappe und Aortenklappe.','دریچه سه‌لتی، ریوی، میترال و آئورتی.'],
 ['Wie fließt das Blut durch das Herz?','Körper → rechter Vorhof → Trikuspidalklappe → rechte Kammer → Pulmonalklappe → Lunge → linker Vorhof → Mitralklappe → linke Kammer → Aortenklappe → Körper.','مسیر خون از بدن به قلب راست، ریه، قلب چپ و سپس بدن.'],
 ['Welche Symptome können bei Herzerkrankungen auftreten?','Auffällige Vitalwerte, Dyspnoe, Ödeme, Zyanose, Thoraxschmerzen, Synkopen, Schwindel und Palpitationen.','علائم شامل تنگی نفس، ورم، کبودی، درد قفسه سینه، سنکوپ و تپش قلب.'],
 ['Was ist bei der Mobilisation wichtig?','Belastungsgrenze beachten; bei Dyspnoe, Schmerzen oder Unwohlsein abbrechen, Vitalparameter erheben und dokumentieren.','حد تحمل بیمار را رعایت کن؛ در تنگی نفس یا درد فعالیت را متوقف کن.'],
 ['Warum kann Oberkörperhochlage hilfreich sein?','Sie wird häufig als angenehm empfunden und kann das Herz bzw. die Atmung entlasten.','بالا آوردن نیم‌تنه می‌تواند احساس راحتی و کاهش فشار بر قلب و تنفس ایجاد کند.'],
 ['Was ist KHK?','Koronare Herzkrankheit: Verengung der Herzkranzgefäße, häufig durch Arteriosklerose.','بیماری عروق کرونر؛ تنگ شدن عروق تغذیه‌کننده قلب.'],
 ['Was ist ein Herzinfarkt?','Ein Verschluss eines Koronargefäßes mit nachfolgender Schädigung bzw. Nekrose von Herzmuskelgewebe.','انسداد عروق کرونر که موجب آسیب و مرگ بخشی از عضله قلب می‌شود.'],
 ['Was ist bei Verdacht auf Herzinfarkt pflegerisch wichtig?','Patient nicht allein lassen, Hilfe holen, Herzbettlage/Oberkörper hoch nach Situation, Vitalparameter und SpO₂ erfassen, weitere Notfallmaßnahmen nach Standard.','بیمار را تنها نگذار، کمک بخواه و علائم حیاتی و اشباع اکسیژن را بررسی کن.'],
 ['Was bedeutet Herzinsuffizienz?','Eine verminderte kardiale Pumpfunktion; sie kann akut oder chronisch sein.','کاهش توان پمپاژ قلب؛ می‌تواند حاد یا مزمن باشد.'],
 ['Welche Zeichen passen zu Herzinsuffizienz?','Dyspnoe, Ödeme, Gewichtszunahme, Zyanose oder feuchte Atemgeräusche können auftreten.','تنگی نفس، ورم، افزایش وزن، کبودی یا صداهای مرطوب تنفسی.'],
 ['Was ist der Unterschied zwischen Links- und Rechtsherzinsuffizienz?','Links: Rückstau eher in die Lunge. Rechts: Rückstau eher in den Körperkreislauf.','نارسایی چپ بیشتر احتقان ریوی؛ نارسایی راست بیشتر احتقان سیستمیک ایجاد می‌کند.'],
 ['Was ist ein EKG?','Eine Aufzeichnung der elektrischen Aktivität des Herzens.','ثبت فعالیت الکتریکی قلب.'],
 ['Welche EKG-Arten kennst du?','Monitor-, Ruhe-, Belastungs- und Langzeit-EKG.','مانیتور، استراحت، فعالیت و هولتر/بلندمدت.'],
 ['Was ist Endokarditis?','Entzündung der Herzinnenhaut, häufig bakteriell.','التهاب لایه داخلی قلب، اغلب باکتریایی.'],
 ['Was ist Myokarditis?','Entzündung des Herzmuskels, häufig viral.','التهاب عضله قلب، اغلب ویروسی.'],
 ['Was ist Perikarditis?','Entzündung des Herzbeutels.','التهاب کیسه اطراف قلب.'],
 ['Was sind Herzrhythmusstörungen?','Störungen der Herzfrequenz und/oder Regelmäßigkeit durch Probleme der Reizbildung oder Reizleitung.','اختلال در تعداد یا نظم ضربان به علت مشکل در تولید یا انتقال تحریک الکتریکی.'],
 ['Welche Pflegeaufgaben gehören zum Medikamentenmanagement?','Regelmäßige Einnahme unterstützen, Wirkung und Nebenwirkungen beobachten, Vitalwerte kontrollieren und Auffälligkeiten melden.','مصرف منظم، بررسی اثر و عوارض، کنترل علائم حیاتی و گزارش موارد غیرعادی.']
],questions:[
 ['Welche Herzhälfte pumpt sauerstoffarmes Blut zur Lunge?',['Die rechte','Die linke','Beide immer direkt'],0],
 ['Welche Klappe liegt zwischen linkem Vorhof und linker Kammer?',['Trikuspidalklappe','Mitralklappe','Pulmonalklappe'],1],
 ['Was ist eine typische pflegerische Reaktion bei Dyspnoe während der Mobilisation?',['Weiter machen','Maßnahme abbrechen, Vitalparameter erheben und informieren','Patient allein lassen'],1],
 ['Was bedeutet KHK?',['Koronare Herzkrankheit','Kardiale Körper-Hypothermie','Keine Herzklappen'],0],
 ['Welche Untersuchung zeichnet die elektrische Herzaktivität auf?',['EKG','Blutzucker','Spirometrie'],0],
 ['Was ist ein mögliches Zeichen einer Herzinsuffizienz?',['Ödeme und Dyspnoe','Nur gesunder Appetit','Immer niedrige Temperatur'],0],
 ['Was ist bei Verdacht auf akuten Herzinfarkt wichtig?',['Patient allein lassen','Hilfe holen und Patient überwachen','Erst am nächsten Tag messen'],1],
 ['Welche Erkrankung betrifft die Herzmuskelschicht?',['Myokarditis','Endokarditis','Perikarditis'],0]
]}
};
let current='';let index=0;let score=0;let exam=false;let answered=false;
function $(id){return document.getElementById(id)}
function init(){
 $('topics').innerHTML=Object.entries(topics).map(([key,t])=>`<div class="card" onclick="openTopic('${key}')">${t.title}<small>${t.cards.length} Lernkarten · ${t.questions.length} Fragen</small></div>`).join('');
}
function openTopic(key){current=key;$('home').classList.add('hidden');$('menu').classList.remove('hidden');$('topicTitle').textContent=topics[key].title;learn()}
function goHome(){$('menu').classList.add('hidden');$('home').classList.remove('hidden');$('content').innerHTML=''}
function learn(){let t=topics[current];$('content').innerHTML=`<div class="panel"><h3>📖 Lernübersicht</h3>${t.cards.map(c=>`<article style="margin:18px 0"><div class="tag">Deutsch</div><h3>${c[0]}</h3><p>${c[1]}</p><div class="tag">فارسی</div><p class="muted">${c[2]}</p></article>`).join('')}</div>`}
function flashcards(){index=0;renderFlash()}
function renderFlash(){let c=topics[current].cards[index];$('content').innerHTML=`<div class="panel"><div class="muted">Karte ${index+1} von ${topics[current].cards.length}</div><div id="flashText" class="flash">${c[0]}</div><div class="toolbar"><button onclick="showFlashAnswer()">Antwort zeigen</button><button class="secondary" onclick="nextFlash()">Nächste →</button></div></div>`}
function showFlashAnswer(){let c=topics[current].cards[index];$('flashText').innerHTML=`<div><b>${c[1]}</b><hr><span class="muted">${c[2]}</span></div>`}
function nextFlash(){index=(index+1)%topics[current].cards.length;renderFlash()}
function quiz(isExam){exam=isExam;index=0;score=0;answered=false;renderQuestion()}
function renderQuestion(){let q=topics[current].questions[index];$('content').innerHTML=`<div class="panel"><div class="muted">${exam?'Prüfung':'Übung'} · Frage ${index+1} von ${topics[current].questions.length}</div><h3>${q[0]}</h3>${q[1].map((o,i)=>`<button class="option" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}<div id="feedback"></div></div>`}
function answer(choice){if(answered)return;answered=true;let q=topics[current].questions[index];let ok=choice===q[2];if(ok)score++;$('feedback').innerHTML=`<p class="result" style="color:${ok?'#16803c':'#b42318'}">${ok?'✅ Richtig!':'❌ Noch nicht richtig.'}</p><p>${q[1][q[2]]}</p><p class="muted">${topics[current].cards.find(c=>c[0].toLowerCase().includes(q[0].split(' ').slice(0,3).join(' ').toLowerCase()))?.[2]||'Merke dir die Begründung und wiederhole die Frage später.'}</p><button onclick="nextQuestion()">${index+1===topics[current].questions.length?'Ergebnis':'Weiter →'}</button>`}
function nextQuestion(){if(index+1===topics[current].questions.length){$('content').innerHTML=`<div class="panel"><h3>🎉 Ergebnis</h3><p class="result">${score} von ${topics[current].questions.length} richtig</p><button onclick="quiz(${exam})">Nochmal</button><button class="secondary" onclick="learn()">Lernübersicht</button></div>`}else{index++;answered=false;renderQuestion()}}
init();
</script>
</body>
</html>
