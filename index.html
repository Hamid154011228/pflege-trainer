button.secondary{

.option{

  background:#eef4fa;

.option:hover{
  background:#dbeafe;
}

.muted{
  color:#667085;
}

.tag{

  margin:3px;

.flash{
  font-size:24px;
  text-align:center;
  min-height:150px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.result{
  font-size:18px;
  font-weight:bold;
}

.learning-card{
  border-bottom:1px solid #e5e7eb;
  padding-bottom:18px;
  margin-bottom:18px;
}

.learning-card:last-child{
  border-bottom:0;
}

.german{
  font-size:17px;
  line-height:1.6;
}

.persian{
  direction:rtl;
  text-align:right;
  font-size:16px;

.info{
  background:#eff6ff;

  padding:14px;
  border-radius:10px;

.warning{
  background:#fff7ed;

  border-radius:10px;

.success{
  background:#ecfdf3;

/* =========================================================
   VARIABLEN
========================================================= */

let current='';

let index=0;

let score=0;

let exam=false;

let answered=false;



/* =========================================================
   HILFSFUNKTION
========================================================= */

function $(id){

  return document.getElementById(id);

}



/* =========================================================
   STARTSEITE
========================================================= */

function init(){

  $('topics').innerHTML=

    Object.entries(topics)

    .map(([key,t])=>`

      <div
        class="card"
        onclick="openTopic('${key}')"
      >

        ${t.title}

        <small>

          ${t.cards.length}
          Lernkarten ·

          ${t.questions.length}
          Fragen

        </small>

      </div>

    `)

    .join('');

}



/* =========================================================
   THEMA ÖFFNEN
========================================================= */

function openTopic(key){

  current=key;

  $('home')
    .classList
    .add('hidden');

  $('menu')
    .classList
    .remove('hidden');

  $('topicTitle')
    .textContent=
    topics[key].title;

  learn();

}



/* =========================================================
   ZURÜCK
========================================================= */

function goHome(){

  $('menu')
    .classList
    .add('hidden');

  $('home')
    .classList
    .remove('hidden');

  $('content')
    .innerHTML='';

}



/* =========================================================
   LERNEN
========================================================= */

function learn(){

  let t=topics[current];

  let html=`

    <div class="panel">

      <h3>📖 Lernübersicht</h3>

      <p class="muted">

        Deutsch lernen +
        فارسی توضیح فارسی

      </p>

  `;


  t.cards.forEach((c,i)=>{

    html+=`

      <article
        class="learning-card"
      >

        <div class="tag">

          Karte ${i+1}

        </div>

        <div class="tag">

          Deutsch

        </div>

        <h3 class="german">

          ${c[0]}

        </h3>

        <p class="german">

          ${c[1]}

        </p>

        <div class="tag">

          فارسی

        </div>

        <p class="persian">

          ${c[2]}

        </p>

      </article>

    `;

  });


  html+=`

    </div>

  `;


  $('content')
    .innerHTML=html;

}



/* =========================================================
   LERNKARTEN
========================================================= */

function flashcards(){

  index=0;

  renderFlash();

}


function renderFlash(){

  let c=
    topics[current]
    .cards[index];


  $('content').innerHTML=`

    <div class="panel">

      <div class="muted">

        Karte ${index+1}
        von
        ${topics[current].cards.length}

      </div>


      <div
        id="flashText"
        class="flash"
      >

        ${c[0]}

      </div>


      <div class="toolbar">

        <button
          onclick="showFlashAnswer()"
        >

          Antwort zeigen

        </button>


        <button
          class="secondary"
          onclick="nextFlash()"
        >

          Nächste →

        </button>

      </div>

    </div>

  `;

}


function showFlashAnswer(){

  let c=
    topics[current]
    .cards[index];


  $('flashText').innerHTML=`

    <div>

      <b>

        ${c[1]}

      </b>

      <hr>

      <span class="muted">

        ${c[2]}

      </span>

    </div>

  `;

}


function nextFlash(){

  index=

    (index+1)
    %
    topics[current]
    .cards.length;

  renderFlash();

}



/* =========================================================
   QUIZ
========================================================= */

function quiz(isExam){

  exam=isExam;

  index=0;

  score=0;

  answered=false;

  renderQuestion();

}



/* =========================================================
   FRAGE ANZEIGEN
========================================================= */

function renderQuestion(){

  let q=
    topics[current]
    .questions[index];


  $('content').innerHTML=`

    <div class="panel">

      <div class="muted">

        ${exam
          ? '🎯 Prüfung'
          : '🧠 Übung'
        }

        ·

        Frage ${index+1}
        von
        ${topics[current]
          .questions.length}

      </div>


      <h3>

        ${q[0]}

      </h3>


      ${q[1]

        .map((o,i)=>`

          <button
            class="option"
            onclick="answer(${i})"
          >

            ${String
              .fromCharCode(65+i)}.
            ${o}

          </button>

        `)

        .join('')

      }


      <div id="feedback"></div>

    </div>

  `;

}



/* =========================================================
   ANTWORT
========================================================= */

function answer(choice){

  if(answered)
    return;

  answered=true;


  let q=
    topics[current]
    .questions[index];


  let ok=
    choice===q[2];


  if(ok)
    score++;


  $('feedback').innerHTML=`

    <div
      class="${ok
        ? 'success'
        : 'warning'}"
    >

      <p class="result">

        ${ok
          ? '✅ Richtig!'
          : '❌ Noch nicht richtig.'
        }

      </p>


      <p>

        <b>
          Richtige Antwort:
        </b>

        ${q[1][q[2]]}

      </p>


      <p>

        ${ok

          ? 'Sehr gut! 👍'

          : 'Diese Antwort noch einmal lernen und später wiederholen.'

        }

      </p>


      <button
        onclick="nextQuestion()"
      >

        ${

          index+1 ===
          topics[current]
          .questions.length

          ? 'Ergebnis'

          : 'Weiter →'

        }

      </button>

    </div>

  `;

}



/* =========================================================
   NÄCHSTE FRAGE
========================================================= */

function nextQuestion(){

  if(

    index+1 ===
    topics[current]
    .questions.length

  ){

    let total=
      topics[current]
      .questions.length;


    let percentage=
      Math.round(
        (score/total)*100
      );


    $('content').innerHTML=`

      <div class="panel">

        <h3>

          🎉 Ergebnis

        </h3>


        <p class="result">

          ${score}
          von
          ${total}
          richtig

        </p>


        <p>

          Ergebnis:

          <b>

            ${percentage} %

          </b>

        </p>


        <div class="toolbar">

          <button
            onclick="quiz(${exam})"
          >

            🔄 Nochmal

          </button>


          <button
            class="secondary"
            onclick="learn()"
          >

            📖 Lernübersicht

          </button>

        </div>

      </div>

    `;

  }

  else{

    index++;

    answered=false;

    renderQuestion();

  }

}



/* =========================================================
   PROGRAMM START
========================================================= */

init();

</script>
